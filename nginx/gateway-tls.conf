# TLS termination in front of the gateway.
#
# The gateway speaks plain HTTP inside the `edge` network; everything that
# reaches it from outside arrives here first. The forwarded-for header set
# below is what the policy engine evaluates source-network conditions against,
# so it must be set by the terminator and never trusted from the client.

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;

        # Overwrite, never append: a client-supplied X-Forwarded-For must not
        # be able to fake its source network.
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header Host             $host;

        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;
    }
}
